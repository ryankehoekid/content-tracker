}

/* ============================================================================
   Progress to goal (always the current calendar month)
============================================================================ */
function ProgressPanel({ allDaily, allReplies, calc, liveReplyRate, liveBookingRate, m }) {
  const { goal, aov, showRate, closeRate, capacity } = calc;
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

  const monthReplies = allReplies.filter((r) => r.date >= monthStart);
  const cashMTD = monthReplies.reduce((s, r) => s + r.cash, 0);
  const gap = Math.max(goal - cashMTD, 0);
  const daysLeft = daysRemainingInMonth(now);
  const pct = Math.min(safeDiv(cashMTD, goal) * 100, 100);

  const replyRate = liveReplyRate > 0 ? liveReplyRate : FALLBACK_REPLY_RATE;
  const bookingRate = liveBookingRate > 0 ? liveBookingRate : FALLBACK_BOOKING_RATE;

  const closesNeeded = Math.ceil(safeDiv(gap, aov));
  const callsNeeded = Math.ceil(safeDiv(safeDiv(closesNeeded, closeRate), showRate));
  const initialsNeeded = Math.ceil(safeDiv(safeDiv(safeDiv(safeDiv(closesNeeded, closeRate), showRate), bookingRate), replyRate));
  const dailyRequired = Math.ceil(safeDiv(initialsNeeded, daysLeft));

  // Actual pace: average initials over the last 7 logged days.
  const recent = allDaily.slice(-7);
  const actualDaily = recent.length ? recent.reduce((s, r) => s + r.initials, 0) / recent.length : 0;

  const stat = (label, val) => (
    <div className="pstat">
      <div className="mono label">{label}</div>
      <div className="display v">{val}</div>
    </div>
  );

  return (
    <div className="card">
      <h2 className="sec">Required From Here, {now.toLocaleDateString("en-IE", { month: "long" })}</h2>
      <div className="pgrid" style={{ marginTop: 4, gridTemplateColumns: "repeat(3, 1fr)" }}>
        {stat("Gap remaining", fmtEuro(gap))}
        {stat("Days left", fmtInt(daysLeft))}
        {stat("Closes still needed", fmtInt(closesNeeded))}
        {stat("Calls to book", fmtInt(gap > 0 ? callsNeeded : 0))}
        {stat("Contract signed", fmtEuro(m.dealValue))}
        {stat("Outstanding", fmtEuro(m.outstanding))}
      </div>

      <div className="vs">
        <div className="half">
          <div className="mono label">Required initials / day</div>
          <div className="display n" style={{ color: C.red }}>{gap > 0 ? fmtInt(dailyRequired) : 0}</div>
        </div>
        <div className="half">
          <div className="mono label">Actual, last 7 logged days</div>
          <div className="display n">{fmtInt(actualDaily)}</div>
        </div>
      </div>
      <div className="chart-note">
        Cash is counted in the month the lead replied. Required pace uses the calculator's settings: {fmtEuro(aov)} cash per close, {fmtPct(showRate)} show, {fmtPct(closeRate)} close.
        {gap > 0 && capacity > 0 && dailyRequired > capacity &&
          " That pace is above the " + fmtInt(capacity) + " a day capacity, so the rest of this goal realistically lands next month: about " + fmtInt(Math.ceil(safeDiv(initialsNeeded, capacity))) + " more sending days at capacity."}
      </div>
    </div>
  );
}

// Two aligned weekly charts, one axis each, so the outreach-to-cash lag is
// visible without implying same-month causation.
function LagCharts({ daily, replies, embedded }) {
  const weekly = useMemo(() => {
    const weekOf = (d) => {
      const x = new Date(d);
      const dow = (x.getDay() + 6) % 7; // Monday start
      x.setDate(x.getDate() - dow);
      return dayKey(x);
    };
    const map = new Map();
    const get = (k) => {
      if (!map.has(k)) map.set(k, { key: k, touches: 0, cash: 0 });
      return map.get(k);
    };
    daily.forEach((r) => { get(weekOf(r.date)).touches += r.initials + r.followUps; });
    replies.forEach((r) => { get(weekOf(r.date)).cash += r.cash; });
    return Array.from(map.values())
      .sort((a, b) => a.key.localeCompare(b.key))
      .map((w) => {
        const [y, m, d] = w.key.split("-").map(Number);
        return { week: shortDate(new Date(y, m - 1, d)), Touches: w.touches, Cash: w.cash };
      });
  }, [daily, replies]);

  return (
    <div className={embedded ? undefined : "card"}>
      {!embedded && <h2 className="sec">Outreach vs Cash, weekly</h2>}
      <div className="mono label" style={{ marginBottom: 8 }}>Touches sent per week</div>
      <div style={{ width: "100%", height: 150 }}>
        <ResponsiveContainer>
          <LineChart data={weekly} syncId="lag" margin={{ top: 6, right: 12, left: -14, bottom: 0 }}>
            <CartesianGrid stroke={C.grid} vertical={false} />
            <XAxis dataKey="week" tick={axisTick} tickLine={false} axisLine={{ stroke: C.line }} minTickGap={24} />
            <YAxis tick={axisTick} tickLine={false} axisLine={false} allowDecimals={false} />
            <Tooltip {...tooltipStyle} cursor={{ stroke: C.steel, strokeWidth: 1 }} />
            <Line type="monotone" dataKey="Touches" stroke={C.bone} strokeWidth={2} dot={false}
              activeDot={{ r: 4, stroke: C.carbon, strokeWidth: 2 }} />
          </LineChart>
        </ResponsiveContainer>
      </div>
      <div className="mono label" style={{ margin: "14px 0 8px" }}>Cash collected per week</div>
      <div style={{ width: "100%", height: 150 }}>
        <ResponsiveContainer>
          <BarChart data={weekly} syncId="lag" margin={{ top: 6, right: 12, left: -14, bottom: 0 }} barCategoryGap="30%">
            <CartesianGrid stroke={C.grid} vertical={false} />
            <XAxis dataKey="week" tick={axisTick} tickLine={false} axisLine={{ stroke: C.line }} minTickGap={24} />
            <YAxis tick={axisTick} tickLine={false} axisLine={false}
              tickFormatter={(v) => "€" + (v >= 1000 ? Math.round(v / 1000) + "k" : v)} />
            <Tooltip {...tooltipStyle} cursor={{ fill: "rgba(244,242,237,0.04)" }}
              formatter={(v) => [fmtEuro(v), "Cash"]} />
            <Bar dataKey="Cash" fill={C.red} radius={[4, 4, 0, 0]} maxBarSize={24} />
          </BarChart>
        </ResponsiveContainer>
      </div>
      <div className="chart-note">Leads close off long term follow up, so this month's cash comes from earlier months' messages. Read the two trends together over weeks, not as same-week cause and effect.</div>
    </div>
  );
}

/* ============================================================================
   Date range picker
============================================================================ */
const RANGE_PRESETS = [
  { id: "week", label: "This week" },
  { id: "month", label: "This month" },
  { id: "all", label: "All time" },
  { id: "custom", label: "Custom" },
];
function rangeBounds(range, customFrom, customTo) {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (range === "week") {
    const from = new Date(today);
    from.setDate(from.getDate() - ((from.getDay() + 6) % 7)); // Monday
    return [from, null];
  }
  if (range === "month") return [new Date(now.getFullYear(), now.getMonth(), 1), null];
  if (range === "custom") {
    const f = customFrom ? new Date(customFrom + "T00:00:00") : null;
    const t = customTo ? new Date(customTo + "T23:59:59") : null;
    return [f, t];
  }
  return [null, null];
}
function RangePicker({ range, setRange, customFrom, setCustomFrom, customTo, setCustomTo }) {
  return (
    <div className="pillrow">
      {RANGE_PRESETS.map((p) => (
        <button key={p.id} className={"btn" + (range === p.id ? " active" : "")}
          onClick={() => setRange(p.id)}>{p.label}</button>
      ))}
      {range === "custom" && (
        <React.Fragment>
          <input type="date" value={customFrom} onChange={(e) => setCustomFrom(e.target.value)} />
          <input type="date" value={customTo} onChange={(e) => setCustomTo(e.target.value)} />
        </React.Fragment>
      )}
    </div>
  );
}

   App
============================================================================ */
const usingSampleData = !DAILY_URL || !REPLIES_URL;

function App() {
  const [daily, setDaily] = useState(null);
  const [replies, setReplies] = useState(null);
  const [leads, setLeads] = useState([]);
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(true);
  const [lastUpdated, setLastUpdated] = useState(null);
  const [range, setRange] = useState("all");
  const [customFrom, setCustomFrom] = useState("");
  const [customTo, setCustomTo] = useState("");
  // Shared planning inputs: the goal calculator edits them, progress uses
  // them. Saved to this browser so slider settings survive refreshes.
  const CALC_DEFAULTS = { goal: 30000, deal: 10000, aov: 5000, showRate: 0.7, closeRate: 0.175, capacity: 105, sendDays: 26 };
  const [calc, setCalc] = useState(() => {
    try { return { ...CALC_DEFAULTS, ...JSON.parse(localStorage.getItem("kg_calc") || "{}") }; }
    catch (e) { return CALC_DEFAULTS; }
  });
  useEffect(() => {
    try { localStorage.setItem("kg_calc", JSON.stringify(calc)); } catch (e) {}
  }, [calc]);
  const [planOpen, setPlanOpen] = useState(false);

  const load = useCallback(async () => {
    setLoading(true);
    setError(null);
    try {
      let dailyText, repliesText;
      if (usingSampleData) {
        const s = buildSampleCsvs();
        dailyText = s.daily; repliesText = s.replies;
      } else {
        const bust = "cb=" + Date.now();
        const join = (u) => u + (u.includes("?") ? "&" : "?") + bust;
        const [r1, r2] = await Promise.all([
          fetch(join(DAILY_URL)), fetch(join(REPLIES_URL)),
        ]);
        if (!r1.ok) throw new Error("Daily Log fetch failed (" + r1.status + ").");
        if (!r2.ok) throw new Error("Replies fetch failed (" + r2.status + ").");
        [dailyText, repliesText] = await Promise.all([r1.text(), r2.text()]);
      }
      setDaily(parseDailyLog(dailyText));
      setReplies(parseReplies(repliesText));
      // Leads feed is best effort: probe tab candidates, fall back silently.
      let leadRows = [];
      if (usingSampleData) {
        try { leadRows = parseLeads(sampleLeadsCsv()); } catch (e) {}
      } else {
        const bust2 = "cb=" + Date.now();
        for (const u of leadsCsvUrls()) {
          try {
            const resp = await fetch(u + (u.includes("?") ? "&" : "?") + bust2);
            if (!resp.ok) continue;
            leadRows = parseLeads(await resp.text());
            break;
          } catch (e) {}
        }
      }
      setLeads(leadRows);
      setLastUpdated(new Date());
    } catch (e) {
      setError(e.message || String(e));
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    if (usingSampleData) return;
    const t = setInterval(load, AUTO_REFRESH_MS);
    return () => clearInterval(t);
  }, [load]);

  const [from, to] = rangeBounds(range, customFrom, customTo);
  const inRange = (d) => (!from || d >= from) && (!to || d <= to);
  const fDaily = useMemo(() => (daily || []).filter((r) => inRange(r.date)), [daily, range, customFrom, customTo]);
  const fReplies = useMemo(() => (replies || []).filter((r) => inRange(r.date)), [replies, range, customFrom, customTo]);
  const m = useMemo(() => computeMetrics(fDaily, fReplies), [fDaily, fReplies]);
  const wow = useMemo(() => weekOverWeek(daily || [], replies || []), [daily, replies]);
  const wsums = useMemo(() => weeklySums(daily || [], replies || []), [daily, replies]);
  const mAll = useMemo(() => computeMetrics(daily || [], replies || []), [daily, replies]);
  // Last 14 calendar days, zero filled, for the tile sparklines.
  const sparks = useMemo(() => {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const byDay = new Map((daily || []).map((r) => [dayKey(r.date), r]));
    const rBy = new Map();
    (replies || []).forEach((r) => {
      const k = dayKey(r.date);
      if (!rBy.has(k)) rBy.set(k, { n: 0, booked: 0, cash: 0 });
      const o = rBy.get(k);
      o.n++; if (r.booked) o.booked++; o.cash += r.cash;
    });
    const out = { initials: [], followUps: [], comments: [], replies: [], booked: [], cash: [] };
    for (let i = 13; i >= 0; i--) {
      const k = dayKey(new Date(today.getTime() - i * DAY_MS));
      const d = byDay.get(k), rp = rBy.get(k);
      out.initials.push(d ? d.initials : 0);
      out.followUps.push(d ? d.followUps : 0);
      out.comments.push(d ? d.comments : 0);
      out.replies.push(rp ? rp.n : 0);
      out.booked.push(rp ? rp.booked : 0);
      out.cash.push(rp ? rp.cash : 0);
    }
    return out;
  }, [daily, replies]);

  if (loading && !daily) {
    return (
      <div className="center">
        <Wordmark size={36} />
        <div className="pulse-dot" />
        <div className="mono label-lg">Pulling the numbers</div>
      </div>
    );
  }
  if (error && !daily) {
    return (
      <div className="center">
        <Wordmark size={36} />
        <div className="card" style={{ maxWidth: 460 }}>
          <div className="mono label-lg" style={{ color: C.red, marginBottom: 10 }}>Data feed problem</div>
          <p style={{ fontSize: 14, lineHeight: 1.6, color: C.bone }}>{error}</p>
          <p className="chart-note">Check the sheet is shared as "Anyone with the link" and the tab names in the CONFIG block match the sheet's tabs exactly.</p>
          <button className="btn" style={{ marginTop: 14 }} onClick={load}>Retry</button>
        </div>
      </div>
    );
  }

  const nowH = new Date();
  const monthStartH = new Date(nowH.getFullYear(), nowH.getMonth(), 1);
  const cashMTD = (replies || []).filter((r) => r.date >= monthStartH).reduce((s, r) => s + r.cash, 0);
  const goalPct = Math.min(safeDiv(cashMTD, calc.goal) * 100, 100);
  const rrH = m.replyRate > 0 ? m.replyRate : FALLBACK_REPLY_RATE;
  const brH = m.bookingRate > 0 ? m.bookingRate : FALLBACK_BOOKING_RATE;
  const initialsNeededH = safeDiv(safeDiv(safeDiv(safeDiv(safeDiv(calc.goal, calc.aov), calc.closeRate), calc.showRate), brH), rrH);
  const weeksH = safeDiv(safeDiv(initialsNeededH, calc.capacity), calc.sendDays / 4.345);
  const timeToGoalH = !(calc.capacity > 0) ? "set capacity"
    : weeksH < 1 ? fmtNum(weeksH * 7, 0) + " days"
    : weeksH < 9 ? fmtNum(weeksH, 1) + " wks"
    : fmtNum(weeksH / 4.345, 1) + " mo";

  // Month end projection: banked cash, plus the open pipeline weighted by
  // stage, plus remaining sends this month damped hard for close lag.
  const projection = (() => {
    const todayH = new Date(nowH.getFullYear(), nowH.getMonth(), nowH.getDate());
    const monthEnd = new Date(nowH.getFullYear(), nowH.getMonth() + 1, 0);
    let pipe = 0;
    (replies || []).forEach((r) => {
      if (r.closed) return;
      if (r.showed) pipe += calc.closeRate * calc.aov;
      else if (r.booked) pipe += calc.showRate * calc.closeRate * calc.aov;
      else pipe += brH * calc.showRate * calc.closeRate * calc.aov;
    });
    let remDays = 0;
    for (let t = todayH.getTime() + DAY_MS; t <= monthEnd.getTime(); t += DAY_MS) {
      if (new Date(t).getDay() !== 0) remDays++;
    }
    const last7H = (daily || []).slice(-7);
    const pace7 = last7H.length ? last7H.reduce((s, r) => s + r.initials, 0) / last7H.length : 0;
    const rrateH = m.replyRate > 0 ? m.replyRate : FALLBACK_REPLY_RATE;
    const future = remDays * pace7 * rrateH * brH * calc.showRate * calc.closeRate * calc.aov * 0.35;
    return cashMTD + pipe + future;
  })();

  return (
    <div className="wrap">
      <div className="sweep" aria-hidden="true" />
      <header className="hdr">
        <div>
          <Wordmark />
          <div className="mono label-lg" style={{ marginTop: 8 }}>
            Ops Terminal // DM Setting <Badge kind="manual">Lab</Badge> {usingSampleData && <Badge kind="sample">Sample data</Badge>} <span className="cursor">▮</span>
          </div>
          <div className="live">
            <span className="live-dot" /> Live feed
            {lastUpdated ? " · synced " + lastUpdated.toLocaleTimeString("en-IE", { hour: "2-digit", minute: "2-digit" }) : ""}
          </div>
        </div>
        <div className="pillrow">
          <RangePicker range={range} setRange={setRange}
            customFrom={customFrom} setCustomFrom={setCustomFrom}
            customTo={customTo} setCustomTo={setCustomTo} />
          <button className="btn" onClick={load} disabled={loading}>
            {loading ? "Refreshing" : "Refresh"}
          </button>
        </div>
      </header>

      {usingSampleData && (
        <div className="card setup" style={{ marginBottom: 12 }}>
          <div className="mono label-lg" style={{ color: C.red, marginBottom: 8 }}>Not wired to the sheet yet</div>
          <p style={{ fontSize: 13, lineHeight: 1.6, color: C.steel }}>
            You are looking at generated sample data. One-time setup: in the Google Sheet,
            set Share to "Anyone with the link" (Viewer), then paste the sheet's URL into{" "}
            <code>SHEET_URL</code> at the top of <code>dm-tracker/index.html</code>. From then
            on the tracker pulls the sheet live, on every open and every 5 minutes.
          </p>
        </div>
      )}
      {error && daily && (
        <div className="card setup" style={{ marginBottom: 12 }}>
          <p style={{ fontSize: 13, color: C.steel }}>Refresh failed: {error}. Showing the last good data.</p>
        </div>
      )}

      {/* Hero: the three numbers the business runs on */}
      <section className="hero">
        <div className="card hero-cell">
          <div className="mono label">Cash per initial sent</div>
          <div className="display hnum"><CountUp value={m.cashPerInitial} format={(v) => fmtEuro(v, 2)} /></div>
          <div className="hsub">what one cold DM is worth</div>
        </div>
        <div className="card hero-cell">
          <div className="mono label">Cash collected, {nowH.toLocaleDateString("en-IE", { month: "long" })}</div>
          <div className="display hnum big"><CountUp value={cashMTD} format={fmtEuro} /></div>
          <div className="pbar" style={{ margin: "12px 0 6px" }}>
            <div className="fill" style={{ width: goalPct + "%" }} />
            <span className="pace-mark" style={{ left: Math.min((nowH.getDate() / new Date(nowH.getFullYear(), nowH.getMonth() + 1, 0).getDate()) * 100, 100) + "%" }} />
          </div>
          <div className="hsub">{fmtPct(goalPct / 100, 0)} of {fmtEuro(calc.goal)} · marker = today</div>
        </div>
        <div className="card hero-cell">
          <div className="mono label">Projected month end</div>
          <div className="display hnum"><CountUp value={projection} format={fmtEuro} /></div>
          <div className="hsub">{fmtPct(safeDiv(projection, calc.goal), 0)} of goal · pipeline weighted, new sends damped for close lag</div>
        </div>
        <div className="card hero-cell">
          <div className="mono label">Time to goal, {fmtInt(calc.capacity)} a day</div>
          <div className="display hnum">{timeToGoalH}</div>
          <div className="hsub">at live rates + calculator settings</div>
        </div>
      </section>

      {/* Headline tiles */}
      <section className="tiles">
        <Tile label="Initials sent" num={m.initials} format={fmtInt} delta={wow.initials} spark={sparks.initials}
          tip={[["this wk", fmtInt(wsums.initials.cur)], ["last wk", fmtInt(wsums.initials.prev)], ["all time", fmtInt(mAll.initials)]]}
          sub={<span><b>{fmtInt(m.touches)}</b> total touches</span>} />
        <Tile label="Follow ups sent" num={m.followUps} format={fmtInt} delta={wow.followUps} spark={sparks.followUps}
          tip={[["this wk", fmtInt(wsums.followUps.cur)], ["last wk", fmtInt(wsums.followUps.prev)], ["all time", fmtInt(mAll.followUps)]]}
          sub={<span><b>{fmtNum(safeDiv(m.followUps, m.initials), 1)}</b> per initial</span>} />
        <Tile label="Comments sent" num={m.comments} format={fmtInt} delta={wow.comments} spark={sparks.comments}
          tip={[["this wk", fmtInt(wsums.comments.cur)], ["last wk", fmtInt(wsums.comments.prev)], ["all time", fmtInt(mAll.comments)]]}
          sub={<span><b>{fmtPct(m.commentCoverage, 0)}</b> of initials</span>} />
        <Tile label="Replies" num={m.replies} format={fmtInt} delta={wow.replies} spark={sparks.replies}
          tip={[["this wk", fmtInt(wsums.replies.cur)], ["last wk", fmtInt(wsums.replies.prev)], ["all time", fmtInt(mAll.replies)]]}
          sub={<span><b>{fmtPct(m.replyRate)}</b> reply rate</span>} />
        <Tile label="Calls booked" num={m.booked} format={fmtInt} delta={wow.booked} spark={sparks.booked}
          tip={[["this wk", fmtInt(wsums.booked.cur)], ["last wk", fmtInt(wsums.booked.prev)], ["all time", fmtInt(mAll.booked)]]}
          sub={<span><b>{fmtPct(m.bookingRate)}</b> booking rate</span>} />
        <Tile label="Calls shown" num={m.shown} format={fmtInt} sub={<span><b>{fmtPct(m.showRate)}</b> show rate</span>} />
        <Tile label="Clients closed" num={m.closed} format={fmtInt} sub={<span><b>{fmtPct(m.closeRate)}</b> close rate</span>} />
        <Tile label="Cash collected" num={m.cash} format={fmtEuro} red delta={wow.cash} spark={sparks.cash}
          tip={[["this wk", fmtEuro(wsums.cash.cur)], ["last wk", fmtEuro(wsums.cash.prev)], ["all time", fmtEuro(mAll.cash)]]}
          sub={<span><b>{fmtEuro(m.outstanding)}</b> outstanding</span>} />
      </section>

      <PalantirCommand daily={daily || []} replies={replies || []} leads={leads} m={m} calc={calc} />

      <div className="card" style={{ marginBottom: 12 }}>
        <h2 className="sec">Rate Gauges, ring fills toward the strong target</h2>
        <div className="gauges">
          <Gauge label="Reply rate" value={m.replyRate} floor={KPI.replyRate[0]} strong={KPI.replyRate[1]}
            sample={m.initials} sampleNeed={150} sampleUnit="initials" />
          <Gauge label="Booking rate" value={m.bookingRate} floor={KPI.bookingRate[0]} strong={KPI.bookingRate[1]}
            sample={m.replies} sampleNeed={10} sampleUnit="replies" />
          <Gauge label="Show rate" value={m.showRate} floor={KPI.showRate[0]} strong={KPI.showRate[1]}
            sample={m.booked} sampleNeed={5} sampleUnit="booked" />
          <Gauge label="Close rate" value={m.closeRate} floor={KPI.closeRate[0]} strong={KPI.closeRate[1]}
            sample={m.shown} sampleNeed={5} sampleUnit="shows" />
        </div>
      </div>

      <div className="grid2">
        <div>
          <div className="card">
            <h2 className="sec">The Funnel</h2>
            <FunnelView m={m} />
          </div>
          <div className="mt"><ReplyWindows replies={fReplies} /></div>
          <div className="mt"><LoadForecast daily={daily || []} leads={leads} /></div>
        </div>
        <div>
          <ProgressPanel allDaily={daily || []} allReplies={replies || []} calc={calc} m={m}
            liveReplyRate={m.replyRate} liveBookingRate={m.bookingRate} />
          <div className="mt"><PipelinePanel replies={fReplies} /></div>
          <div className="mt"><StreaksPanel daily={daily || []} replies={replies || []} capacity={calc.capacity} /></div>
        </div>
      </div>

      <div className="grid2 mt">
        <FieldLog daily={daily || []} replies={replies || []} capacity={calc.capacity} />
        <ActivityPanel daily={fDaily} replies={fReplies} />
      </div>

      {/* Planning console, collapsed until needed */}
      <div className="card" style={{ marginTop: 12 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>
          <h2 className="sec" style={{ margin: 0 }}>Planning Console</h2>
          <div className="plan-sum">
            <span>Time to goal <span className="pr">{timeToGoalH}</span></span>
            <span>Initials needed <b>{fmtInt(initialsNeededH)}</b></span>
            <span>Capacity <b>{fmtInt(calc.capacity)}/day</b></span>
          </div>
          <button className="btn" onClick={() => setPlanOpen(!planOpen)}>{planOpen ? "[ Collapse ]" : "[ Expand ]"}</button>
        </div>
      </div>
      {planOpen && (
        <div className="mt">
          <GoalCalculator calc={calc} setCalc={setCalc}
            liveReplyRate={m.replyRate} liveBookingRate={m.bookingRate}
            liveCashPerClose={safeDiv(m.cash, m.closed)}
            liveShowRate={m.showRate} liveCloseRate={m.closeRate}
            liveBooked={m.booked} liveShown={m.shown} />
        </div>
      )}

      <footer className="foot">
        <Wordmark size={16} />
        <span className="mono label">
          {lastUpdated ? "Updated " + lastUpdated.toLocaleTimeString("en-IE", { hour: "2-digit", minute: "2-digit" }) : ""}
          {!usingSampleData ? " · auto refresh 5 min" : ""}
        </span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
