const usingSampleData = !DAILY_URL || !REPLIES_URL;

function App() {
  const [daily, setDaily] = useState(null);
  const [replies, setReplies] = useState(null);
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(true);
  const [lastUpdated, setLastUpdated] = useState(null);
  const [range, setRange] = useState("all");
  const [customFrom, setCustomFrom] = useState("");
  const [customTo, setCustomTo] = useState("");
  // Shared planning inputs: the goal calculator edits them, progress uses
  // them. Saved to this browser so slider settings survive refreshes.
  const CALC_DEFAULTS = { goal: 30000, deal: 10000, aov: 5000, showRate: 0.7, closeRate: 0.175, capacity: 100, sendDays: 26 };
  const [calc, setCalc] = useState(() => {
    try { return { ...CALC_DEFAULTS, ...JSON.parse(localStorage.getItem("kg_calc") || "{}") }; }
    catch (e) { return CALC_DEFAULTS; }
  });
  useEffect(() => {
    try { localStorage.setItem("kg_calc", JSON.stringify(calc)); } catch (e) {}
  }, [calc]);

  const load = useCallback(async () => {
    setLoading(true);
    setError(null);
    try {
      let dailyText, repliesText;
      if (usingSampleData) {
        const s = buildSampleCsvs();
        dailyText = s.daily; repliesText = s.replies;
      } else {
        const bust = "cb=" + Date.now();
        const join = (u) => u + (u.includes("?") ? "&" : "?") + bust;
        const [r1, r2] = await Promise.all([
          fetch(join(DAILY_URL)), fetch(join(REPLIES_URL)),
        ]);
        if (!r1.ok) throw new Error("Daily Log fetch failed (" + r1.status + ").");
        if (!r2.ok) throw new Error("Replies fetch failed (" + r2.status + ").");
        [dailyText, repliesText] = await Promise.all([r1.text(), r2.text()]);
      }
      setDaily(parseDailyLog(dailyText));
      setReplies(parseReplies(repliesText));
      setLastUpdated(new Date());
    } catch (e) {
      setError(e.message || String(e));
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    if (usingSampleData) return;
    const t = setInterval(load, AUTO_REFRESH_MS);
    return () => clearInterval(t);
  }, [load]);

  const [from, to] = rangeBounds(range, customFrom, customTo);
  const inRange = (d) => (!from || d >= from) && (!to || d <= to);
  const fDaily = useMemo(() => (daily || []).filter((r) => inRange(r.date)), [daily, range, customFrom, customTo]);
  const fReplies = useMemo(() => (replies || []).filter((r) => inRange(r.date)), [replies, range, customFrom, customTo]);
  const m = useMemo(() => computeMetrics(fDaily, fReplies), [fDaily, fReplies]);
  const wow = useMemo(() => weekOverWeek(daily || [], replies || []), [daily, replies]);
  // Last 14 calendar days, zero filled, for the tile sparklines.
  const sparks = useMemo(() => {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const byDay = new Map((daily || []).map((r) => [dayKey(r.date), r]));
    const rBy = new Map();
    (replies || []).forEach((r) => {
      const k = dayKey(r.date);
      if (!rBy.has(k)) rBy.set(k, { n: 0, booked: 0, cash: 0 });
      const o = rBy.get(k);
      o.n++; if (r.booked) o.booked++; o.cash += r.cash;
    });
    const out = { initials: [], followUps: [], comments: [], replies: [], booked: [], cash: [] };
    for (let i = 13; i >= 0; i--) {
      const k = dayKey(new Date(today.getTime() - i * DAY_MS));
      const d = byDay.get(k), rp = rBy.get(k);
      out.initials.push(d ? d.initials : 0);
      out.followUps.push(d ? d.followUps : 0);
      out.comments.push(d ? d.comments : 0);
      out.replies.push(rp ? rp.n : 0);
      out.booked.push(rp ? rp.booked : 0);
      out.cash.push(rp ? rp.cash : 0);
    }
    return out;
  }, [daily, replies]);

  if (loading && !daily) {
    return (
      <div className="center">
        <Wordmark size={36} />
        <div className="pulse-dot" />
        <div className="mono label-lg">Pulling the numbers</div>
      </div>
    );
  }
  if (error && !daily) {
    return (
      <div className="center">
        <Wordmark size={36} />
        <div className="card" style={{ maxWidth: 460 }}>
          <div className="mono label-lg" style={{ color: C.red, marginBottom: 10 }}>Data feed problem</div>
          <p style={{ fontSize: 14, lineHeight: 1.6, color: C.bone }}>{error}</p>
          <p className="chart-note">Check the sheet is shared as "Anyone with the link" and the tab names in the CONFIG block match the sheet's tabs exactly.</p>
          <button className="btn" style={{ marginTop: 14 }} onClick={load}>Retry</button>
        </div>
      </div>
    );
  }

  const nowH = new Date();
  const monthStartH = new Date(nowH.getFullYear(), nowH.getMonth(), 1);
  const cashMTD = (replies || []).filter((r) => r.date >= monthStartH).reduce((s, r) => s + r.cash, 0);
  const goalPct = Math.min(safeDiv(cashMTD, calc.goal) * 100, 100);
  const rrH = m.replyRate > 0 ? m.replyRate : FALLBACK_REPLY_RATE;

  const weeksH = safeDiv(safeDiv(initialsNeededH, calc.capacity), calc.sendDays / 4.345);
  const timeToGoalH = !(calc.capacity > 0) ? "set capacity"

    : weeksH < 9 ? fmtNum(weeksH, 1) + " wks"
    : fmtNum(weeksH / 4.345, 1) + " mo";

  return (
    <div className="wrap">
      <div className="sweep" aria-hidden="true" />
      <header className="hdr">
        <div>
          <Wordmark />
          <div className="mono label-lg" style={{ marginTop: 8 }}>
            Ops Terminal // DM Setting <Badge kind="manual">Lab</Badge> {usingSampleData && <Badge kind="sample">Sample data</Badge>} <span className="cursor">▮</span>
          </div>
          <div className="live">
            <span className="live-dot" /> Live feed
            {lastUpdated ? " · synced " + lastUpdated.toLocaleTimeString("en-IE", { hour: "2-digit", minute: "2-digit" }) : ""}
          </div>
        </div>
        <div className="pillrow">
          <RangePicker range={range} setRange={setRange}
            customFrom={customFrom} setCustomFrom={setCustomFrom}
            customTo={customTo} setCustomTo={setCustomTo} />
          <button className="btn" onClick={load} disabled={loading}>
            {loading ? "Refreshing" : "Refresh"}
          </button>
        </div>
      </header>

      {usingSampleData && (
        <div className="card setup" style={{ marginBottom: 12 }}>
          <div className="mono label-lg" style={{ color: C.red, marginBottom: 8 }}>Not wired to the sheet yet</div>
          <p style={{ fontSize: 13, lineHeight: 1.6, color: C.steel }}>
            You are looking at generated sample data. One-time setup: in the Google Sheet,
            set Share to "Anyone with the link" (Viewer), then paste the sheet's URL into{" "}
            <code>SHEET_URL</code> at the top of <code>dm-tracker/index.html</code>. From then
            on the tracker pulls the sheet live, on every open and every 5 minutes.

        </div>
        <div>
          <ProgressPanel allDaily={daily || []} allReplies={replies || []} calc={calc}
            liveReplyRate={m.replyRate} liveBookingRate={m.bookingRate} />
          <div className="mt"><PipelinePanel replies={fReplies} /></div>
          <div className="mt"><StreaksPanel daily={daily || []} replies={replies || []} capacity={calc.capacity} /></div>
        </div>
      </div>

      <div className="grid2 mt">
        <GoalCalculator calc={calc} setCalc={setCalc}
          liveReplyRate={m.replyRate} liveBookingRate={m.bookingRate}
          liveCashPerClose={safeDiv(m.cash, m.closed)}
          liveShowRate={m.showRate} liveCloseRate={m.closeRate}
          liveBooked={m.booked} liveShown={m.shown} />
        <div>
          <VolumeChart daily={fDaily} />
          <div className="mt"><LagCharts daily={fDaily} replies={fReplies} /></div>
        </div>
      </div>

      <footer className="foot">
        <Wordmark size={16} />
        <span className="mono label">
          {lastUpdated ? "Updated " + lastUpdated.toLocaleTimeString("en-IE", { hour: "2-digit", minute: "2-digit" }) : ""}
          {!usingSampleData ? " · auto refresh 5 min" : ""}
        </span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
